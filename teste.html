<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.js" method="post" autocomplete="on">
        <p><label for="inome">Nome :</label>
        <input type="text" name="Nome" id="inome" minlength="5" maxlength="15" required>
        </p>

        <p>
            <label for="ise">Senha :</label>
            <input type="password" name="senha" id="ise" required minlength="3" maxlength="15" autocomplete="new-password">
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
